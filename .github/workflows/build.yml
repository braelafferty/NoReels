name: Build NoReels IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned - Sideloadly signs it later)
        run: |
          xcodebuild \
            -project NoReels.xcodeproj \
            -target NoReels \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/NoReels.app Payload/
          zip -qry NoReels.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: NoReels-ipa
          path: NoReels.ipa
